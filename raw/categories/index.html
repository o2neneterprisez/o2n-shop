<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8ff"><title>Shop by Category | O2N Mall</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17213c;background:#f7f8fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0%,#e7edff 0,transparent 28%),#f7f8fc}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(18px,5vw,70px);background:#fff;border-bottom:1px solid #e8ebf4}.brand{font-weight:950;font-size:26px;letter-spacing:-1.4px;color:#152447;text-decoration:none}.brand span{color:#4d64ef}.back{font-weight:750;text-decoration:none;color:#26365d;background:#f0f3ff;padding:11px 15px;border-radius:14px}.hero{max-width:1200px;margin:auto;padding:clamp(35px,7vw,78px) 20px 28px;text-align:center}.pill{display:inline-flex;padding:8px 13px;border-radius:99px;background:#e8edff;color:#4255c7;font-size:11px;font-weight:900;letter-spacing:1.3px}.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-2px;margin:20px 0 14px;color:#162447}.hero h1 em{font-style:normal;background:linear-gradient(100deg,#5865e8,#d04da8);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#67718a;font-size:clamp(15px,2vw,18px);max-width:590px;margin:0 auto;line-height:1.7}.grid{max-width:1200px;margin:0 auto;padding:14px 20px 64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.category-card{position:relative;overflow:hidden;min-height:270px;padding:25px;border-radius:25px;text-decoration:none;color:#192746;display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 12px 34px #24335b0c;border:1px solid #ffffffc9;transition:transform .2s,box-shadow .2s}.category-card:hover{transform:translateY(-5px);box-shadow:0 18px 38px #24335b20}.category-card:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-40px;top:24px;background:#ffffff66}.category-card:after{content:"";position:absolute;width:120px;height:120px;border:1px solid #ffffff9c;border-radius:50%;right:0;top:55px}.all{background:linear-gradient(135deg,#dce6ff,#a9bbff)}.fashion{background:linear-gradient(135deg,#f9dff0,#f7b6d5)}.grocery{background:linear-gradient(135deg,#d9f7dc,#a9e7bd)}.tech{background:linear-gradient(135deg,#d9edff,#a8d3fb)}.home{background:linear-gradient(135deg,#ffebd6,#f6cda9)}.beauty{background:linear-gradient(135deg,#f0e1ff,#d6bcff)}.other{background:linear-gradient(135deg,#ffefbd,#ffdb7b)}.eyebrow{font-size:10px;font-weight:950;letter-spacing:1.5px;opacity:.68}.emoji{font-size:58px;margin:18px 0 9px;filter:drop-shadow(0 8px 8px #19274616);z-index:1}.card-title{font-size:25px;font-weight:900;letter-spacing:-.7px;z-index:1}.card-sub{font-size:13px;line-height:1.5;margin-top:6px;color:#35435f;z-index:1}.shop-link{margin-top:auto;padding-top:22px;font-size:13px;font-weight:850;display:flex;gap:16px;align-items:center;z-index:1}.shop-link b{background:#ffffffa8;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;font-size:16px}.foot{text-align:center;padding:0 20px 32px;color:#7b8499;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.category-card{min-height:250px;padding:20px;border-radius:21px}.emoji{font-size:49px}.card-title{font-size:22px}}@media(max-width:430px){.grid{padding:10px 13px 42px;gap:10px}.category-card{padding:16px;min-height:225px}.card-title{font-size:19px}.card-sub{font-size:12px}.emoji{font-size:43px;margin:17px 0 8px}.shop-link{font-size:11px;gap:8px}.top{padding:16px}.brand{font-size:23px}}</style></head><body><header class="top"><a class="brand" href="/">O2N<span> Mall</span></a><a class="back" href="/">← Back to home</a></header><main><section class="hero"><span class="pill">YOUR NEXT GREAT FIND STARTS HERE</span><h1>Shop by <em>category.</em></h1><p>Explore thoughtfully curated collections from local shops. Pick a banner and find something you’ll love.</p></section><section id="categoryGrid" class="grid" aria-label="Shop all categories"><p>Loading categories…</p></section></main><footer class="foot">O2N Mall · Discover more. Support local.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const catClient=supabase.createClient('https://mzlxghpmejognqdwauob.supabase.co','sb_publishable_6WvD_otK8Fy8zJID9yDSfw_vI9B6xDW');
const catEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catStyles=['all','fashion','grocery','tech','home','beauty','other'];
const catIcons=['✦','👕','🥬','🎧','🛋️','✨','🧺'];
async function renderManagedCategories(){const grid=document.getElementById('categoryGrid');const {data,error}=await catClient.from('categories').select('id,name,slug,description,parent_id').eq('is_active',true).order('name');if(error){grid.innerHTML='<p>Categories could not load. Please refresh the page.</p>';return}const rows=data||[],parents=rows.filter(c=>!c.parent_id);const byParent=new Map();rows.filter(c=>c.parent_id).forEach(c=>{if(!byParent.has(c.parent_id))byParent.set(c.parent_id,[]);byParent.get(c.parent_id).push(c)});const cards=[{name:'Everything',slug:'All',description:'Browse all available products',icon:'✦',style:'all'}];parents.forEach((p,i)=>{cards.push({name:p.name,slug:p.slug,description:p.description||'Explore '+p.name,icon:catIcons[(i+1)%catIcons.length],style:catStyles[(i+1)%catStyles.length],children:byParent.get(p.id)||[]})});grid.innerHTML=cards.map(c=>'<a class="category-card '+c.style+'" href="/?category='+encodeURIComponent(c.slug==='All'?'All':c.name)+'#products"><span class="eyebrow">'+(c.children?.length?'CATEGORY & SUBCATEGORIES':'EXPLORE THE MALL')+'</span><span class="emoji">'+c.icon+'</span><span class="card-title">'+catEsc(c.name)+'</span><span class="card-sub">'+catEsc(c.description)+'</span>'+(c.children?.length?'<span class="card-sub">'+c.children.map(ch=>'<span style="display:inline-block;background:#ffffffb5;border-radius:99px;padding:4px 8px;margin:4px 4px 0 0">'+catEsc(ch.name)+'</span>').join('')+'</span>':'')+'<span class="shop-link">Explore collection <b>→</b></span></a>').join('')||'<p>No active categories are available yet.</p>'}
renderManagedCategories();
</script></body></html>
